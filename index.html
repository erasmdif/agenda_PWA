<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3f0">
  <meta name="color-scheme" content="light dark">
  <title>Agenda</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body data-sec="home">
  <div id="bgfx" aria-hidden="true"></div>
  <div id="lock" class="lock" hidden></div>

  <div id="app" hidden>
    <header class="top" id="top"></header>
    <main id="view" tabindex="-1"></main>
    <div class="fabs">
      <button id="fab-mic" class="fab small" type="button" aria-label="Detta con la voce">🎙️</button>
      <button id="fab-add" class="fab" type="button" aria-label="Aggiungi">+</button>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sezioni"></nav>
  </div>

  <div id="alerts" aria-live="assertive"></div>
  <div id="sheet" class="overlay" hidden></div>
  <div id="dialog" class="overlay dlg" hidden></div>
  <div id="viewer" class="viewer" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <noscript><p style="padding:24px">Questa app richiede JavaScript.</p></noscript>
  <script src="logic.js"></script>
  <script src="chatgpt-bridge.js"></script>
  <script src="state-sync.js"></script>
  <script src="daily-reminder.js"></script>
  <script src="app.js"></script>
</body>
</html>
